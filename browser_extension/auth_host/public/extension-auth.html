<!doctype html>
<html lang="zh-Hant">
  <head>

    <title>登入刷哪張</title>
    <link rel="stylesheet" href="/extension-auth.css">
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">卡</div>
