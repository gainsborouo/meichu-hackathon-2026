name: meichu-hackathon-2026

services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DEBUG: "${DEBUG:-true}"
    healthcheck:
      # The runtime image is python:slim, so probe with stdlib rather than curl.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  caddy:
    build: ./frontend
    ports:
      - "8000:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

configs:
  caddyfile:
    content: |
      :80 {
        @api path /api /api/*
        handle @api {
          reverse_proxy backend:8000
        }
        handle {
          root * /srv
          try_files {path} /index.html
          file_server
        }
      }
