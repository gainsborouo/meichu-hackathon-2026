name: meichu-hackathon-2026

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8081:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DEBUG: "${DEBUG:-true}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}}"
      # The statement agent needs a vision-capable OpenAI-compatible endpoint.
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
    # Dev setup: the source is bind-mounted over the copy baked into the image,
    # so an edit on the host is live in the container and a rebuild is only
    # needed when dependencies change. Read-only because nothing in the
    # container should write to your working tree; the image sets
    # PYTHONDONTWRITEBYTECODE, so no .pyc files are attempted either.
    #
    # An image built from this Dockerfile still contains the code and runs
    # standalone -- these mounts only shadow it while developing.
    volumes:
      - ./backend/app:/app/app:ro
      # The statement agent reads SKILL.md and its scripts at runtime, so mount
      # them too or skill edits would need a rebuild to take effect.
      - ./backend/skills:/app/skills:ro
      # So a new migration can be applied with `compose exec` without a rebuild.
      - ./backend/alembic:/app/alembic:ro
    # The image CMD has no --reload (correct for a built image); dev wants it,
    # and uvicorn[standard] ships watchfiles. Watching skills/ too because the
    # skill's scripts are imported once at startup, so editing one needs a
    # restart to take effect (SKILL.md itself is re-read per request).
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
      - --reload-dir
      - /app/skills
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The runtime image is python:slim, so probe with stdlib rather than curl.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    develop:
      watch:
        # No sync action: the bind mount already puts the source in the
        # container, and syncing on top of a mount would fight it. Dependency
        # changes still need the image rebuilt.
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      # Local-dev fallback only; set POSTGRES_PASSWORD in the environment for anything real.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    build: ./frontend
    ports:
      - "8000:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

volumes:
  pgdata:

configs:
  caddyfile:
    content: |
      :80 {
        @api path /api /api/*
        handle @api {
          reverse_proxy backend:8000
        }
        handle {
          root * /srv
          try_files {path} /index.html
          file_server
        }
      }
