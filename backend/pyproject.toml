[project]
name = "backend"
version = "0.1.0"
description = "Backend API for meichu-hackathon-2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "pydantic-settings>=2.11.0",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
