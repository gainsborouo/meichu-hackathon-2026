[project]
name = "backend"
version = "0.1.0"
description = "Backend API for meichu-hackathon-2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.118.0",
    "google-adk[extensions]>=2.9.2",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx2>=2.13.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
