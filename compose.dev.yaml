name: meichu-hackathon-2026-dev

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DEBUG: "${DEBUG:-true}"
      DATABASE_URL: "${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}}"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      # Local-dev fallback only; set POSTGRES_PASSWORD in the environment for anything real.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-app}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  caddy:
    image: caddy:alpine
    ports:
      - "8000:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

volumes:
  pgdata:

configs:
  caddyfile:
    content: |
      :80 {
        @api path /api /api/*
        handle @api {
          reverse_proxy backend:8000
        }
        handle {
          reverse_proxy frontend:5173
        }
      }
